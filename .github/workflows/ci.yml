name: production-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:artifact-tools
      - run: npm run test:ops-tools
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nginx
      - run: npm run test:nginx-config
      - run: npm run audit:prod
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://calculandia.ru
      - run: npm run smoke:standalone
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - run: npm run release:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculandia-${{ github.sha }}
          path: .next/standalone
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculandia-${{ github.sha }}
          path: .artifact-roundtrip
      - run: npm run artifact:verify-uploaded -- .artifact-roundtrip "${{ github.sha }}"
