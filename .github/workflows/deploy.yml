name: deploy

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      SERVER: 5.188.30.214
    steps:
      - name: Prepare SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy via forced-command gate
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "root@$SERVER" "deploy $RELEASE_SHA $RELEASE_RUN_ID"
      - name: Independent external verification
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 15 https://calculandia.ru/healthz)"
          node -e 'const v=JSON.parse(process.argv[1]); if(v.status!=="ok"||v.version!==process.argv[2])process.exit(1)' "$health" "$RELEASE_SHA"
          host="$(curl --fail --silent --show-error --max-time 15 https://calculandia.ru/host-healthz)"
          node -e 'const v=JSON.parse(process.argv[1]); const now=Math.floor(Date.now()/1000); if(v.status!=="ok"||v.release!==process.argv[2]||now-v.checkedAt>660)process.exit(1)' "$host" "$RELEASE_SHA"
          curl --fail --silent --show-error --max-time 15 --output /dev/null https://calculandia.ru/
          echo "external verification passed for $RELEASE_SHA"
