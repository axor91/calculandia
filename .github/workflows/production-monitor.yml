name: production-monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail after checks to verify the alert channel"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  uptime:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: HTTPS and application health
        env:
          EXPECTED_RELEASE: ${{ vars.PRODUCTION_RELEASE_SHA }}
          EXPECTED_RESTARTS: ${{ vars.PRODUCTION_PM2_RESTART_BASELINE }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RESTARTS" =~ ^[0-9]+$ ]]
          curl --fail --silent --show-error --max-time 15 https://calculandia.ru/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://calculandia.ru/sitemap.xml >/dev/null
          response="$(curl --fail --silent --show-error --max-time 15 https://calculandia.ru/healthz)"
          node -e 'const value=JSON.parse(process.argv[1]); if(value.status!=="ok" || value.version!==process.argv[2]) process.exit(1)' "$response" "$EXPECTED_RELEASE"
          host_response="$(curl --fail --silent --show-error --max-time 15 https://calculandia.ru/host-healthz)"
          node -e 'const value=JSON.parse(process.argv[1]); const now=Math.floor(Date.now()/1000); if(value.status!=="ok" || value.release!==process.argv[2] || !Number.isSafeInteger(value.checkedAt) || now-value.checkedAt<0 || now-value.checkedAt>660 || String(value.pm2Restarts)!==process.argv[3]) process.exit(1)' "$host_response" "$EXPECTED_RELEASE" "$EXPECTED_RESTARTS"
      - name: TLS has more than 14 days remaining
        run: |
          set -euo pipefail
          echo | openssl s_client -servername calculandia.ru -connect calculandia.ru:443 2>/dev/null | openssl x509 -checkend 1209600 -noout
      - name: Simulated alert
        if: ${{ inputs.simulate_failure == true }}
        run: exit 1
