name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:artifact-tools
      - run: npm run test:ops-tools
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nginx
      - run: npm run test:nginx-config
      - run: npm run audit:prod
      - run: node scripts/test-docs-links.mjs

  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://calculandia.ru
      - run: npm run smoke:standalone
      - run: node scripts/test-bundle-budget.mjs
      - run: npm run release:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculandia-${{ github.sha }}
          path: .next/standalone
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculandia-${{ github.sha }}
          path: .artifact-roundtrip
      - run: npm run artifact:verify-uploaded -- .artifact-roundtrip "${{ github.sha }}"

  e2e:
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculandia-${{ github.sha }}
          path: .next/standalone
      - run: npm run artifact:verify-uploaded -- .next/standalone "${{ github.sha }}"
      - run: npx playwright test --project=${{ matrix.browser }}

  release-gate:
    needs: [quality, artifact, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            for (const job of ["quality", "artifact", "e2e"]) {
              if (needs[job].result !== "success") {
                console.error(`${job}: ${needs[job].result}`);
                process.exit(1);
              }
            }
            console.log("release-gate: artifact is deployable");
          '
