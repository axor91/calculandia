workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - when: never
stages: [check, browser, deploy]
default:
  image: node:22.22.2-bookworm
  tags: [calculandia-check]
  interruptible: false
  timeout: 40m
  before_script:
    - test "$(node --version)" = v22.22.2
    - test "$(npm --version)" = 10.9.7
    - npm ci --no-fund --no-audit
variables:
  GIT_DEPTH: "0"
  HOSTNAME: 127.0.0.1
  PORT: "3212"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://calculandia.ru
  NODE_OPTIONS: --max-old-space-size=4096
  npm_config_cache: /tmp/npm-cache
.release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
quality:
  extends: .release
  stage: check
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nginx python3
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm run test:coverage -- --reporter=default --reporter=junit --outputFile=artifacts/unit.xml
    - npm run test:artifact-tools
    - npm run test:ops-tools
    - npm run test:nginx-config
    - npm run audit:prod
    - npm run test:docs-links
    - python3 .ci/test_receiver.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/unit.xml, coverage/]
    reports:
      junit: artifacts/unit.xml
artifact:
  extends: .release
  stage: check
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
    - npm run build
    - npm run smoke:standalone
    - npm run test:bundle-budget
    - npm run release:verify
    - python3 .ci/publication.py
    - python3 .ci/package.py
  artifacts:
    expire_in: 14 days
    paths:
      [
        artifacts/release.tar.gz,
        artifacts/release-metadata.json,
        artifacts/publication-static.json,
        artifacts/publication-public.json,
        artifacts/publication-pages.json,
      ]
    reports:
      dotenv: artifacts/release.env
e2e:
  extends: .release
  stage: browser
  needs:
    - job: artifact
      artifacts: true
  script:
    - mkdir -p .next
    - tar -xzf artifacts/release.tar.gz -C .next
    - npm run artifact:verify-uploaded -- .next/standalone "$CI_COMMIT_SHA"
    - npx playwright install --with-deps chromium firefox webkit
    - npx playwright test --reporter=line,junit
  variables:
    PLAYWRIGHT_JUNIT_OUTPUT_NAME: artifacts/e2e.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/e2e.xml, test-results/]
    reports:
      junit: artifacts/e2e.xml
deploy-production:
  stage: deploy
  image: python:3.12-slim-bookworm
  resource_group: calculandia-production
  timeout: 20m
  environment:
    name: production
    url: https://calculandia.ru
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  needs:
    - job: quality
      artifacts: false
    - job: artifact
      artifacts: true
    - job: e2e
      artifacts: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client
  script:
    - python .ci/deploy.py
  artifacts:
    when: always
    expire_in: 90 days
    paths: [artifacts/deploy-result.json]
nightly-audit:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  script:
    - npm run audit:prod
nightly-performance:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  script:
    - npm run build
    - npx playwright install --with-deps chromium
    - export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
    - npx lhci autorun --config=.lighthouserc.nightly.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/lighthouse/]
