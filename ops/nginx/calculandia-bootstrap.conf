# Temporary HTTP-only configuration used while obtaining the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name calculandia.ru www.calculandia.ru;

    access_log /var/log/calculandia/access.log calculandia_minimal;
    error_log /var/log/calculandia/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/fastpanel2/web/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://calculandia.ru$request_uri;
    }
}
