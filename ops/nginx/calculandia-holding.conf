server {
    listen 203.0.113.10:80;
    server_name calculandia.ru www.calculandia.ru;

    access_log /var/log/calculandia/access.log calculandia_minimal;
    error_log /var/log/calculandia/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/fastpanel2/web/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://calculandia.ru$request_uri;
    }
}

server {
    listen 203.0.113.10:443 ssl;
    http2 on;
    server_name calculandia.ru www.calculandia.ru;

    ssl_certificate /etc/letsencrypt/live/calculandia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calculandia.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/calculandia/access.log calculandia_minimal;
    error_log /var/log/calculandia/error.log warn;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Retry-After "3600" always;
    default_type text/plain;
    return 503 "Calculandia is preparing for launch.\n";
}
