# Loaded from nginx's http context via /etc/nginx/conf.d.
# Deliberately excludes query strings, referrers and user agents.
log_format calculandia_minimal
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr
    zone=calculandia_client_errors:10m
    rate=10r/m;
