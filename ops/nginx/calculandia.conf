server {
    listen 203.0.113.20:80;
    server_name calculandia.ru www.calculandia.ru;

    access_log /var/log/calculandia/access.log calculandia_minimal;
    error_log /var/log/calculandia/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/fastpanel2/web/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://calculandia.ru$request_uri;
    }
}

server {
    listen 203.0.113.20:443 ssl;
    http2 on;
    server_name www.calculandia.ru;

    ssl_certificate /etc/letsencrypt/live/calculandia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calculandia.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/calculandia/access.log calculandia_minimal;
    error_log /var/log/calculandia/error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://calculandia.ru$request_uri;
}

server {
    listen 203.0.113.20:443 ssl;
    http2 on;
    server_name calculandia.ru;

    ssl_certificate /etc/letsencrypt/live/calculandia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calculandia.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/calculandia/access.log calculandia_minimal;
    error_log /var/log/calculandia/error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;

    location = /host-healthz {
        alias /var/lib/calculandia/monitor/health.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /api/client-errors {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        limit_req zone=calculandia_client_errors burst=5 nodelay;
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
